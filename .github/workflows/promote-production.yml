name: Promote approved staging build

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful staging workflow run ID
        required: true
        type: string
  repository_dispatch:
    types: [promote-production]

concurrency:
  group: production-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      STAGING_REPOSITORY: ${{ vars.STAGING_REPOSITORY }}
      FRONTEND_REPOSITORY: DailyCreativeRD/ssg-nextjs-page
    steps:
      - name: Resolve staging run ID
        id: release
        env:
          MANUAL_RUN_ID: ${{ inputs.staging_run_id }}
          DISPATCH_RUN_ID: ${{ github.event.client_payload.staging_run_id }}
        run: |
          run_id="${MANUAL_RUN_ID:-$DISPATCH_RUN_ID}"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      # Check 1 (blocking): the ZIP downloads and its checksum matches.
      - name: Download approved production candidate
        env:
          RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          asset="production-site-${RUN_ID}.zip"
          base_url="https://github.com/${STAGING_REPOSITORY}/releases/download/staging-${RUN_ID}"
          curl --fail --location --retry 3 --output "$asset" "$base_url/$asset"
          curl --fail --location --retry 3 --output "$asset.sha256" "$base_url/$asset.sha256"
          sha256sum --check "$asset.sha256"
          mkdir site
          unzip -q "$asset" -d site

      # The candidate must carry a manifest naming the run being promoted.
      - name: Verify entry point and manifest
        env:
          RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          test -f site/index.html
          test -f site/release-manifest.txt
          grep -Fx "run_id=${RUN_ID}" site/release-manifest.txt

      # Check 2 (blocking): the run ID is a real, successful run of the
      # staging deploy workflow, and its commit matches the manifest.
      - name: Verify staging run identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          manifest_sha=$(grep '^source_sha=' site/release-manifest.txt | cut -d= -f2)
          run_json=$(gh api "repos/${STAGING_REPOSITORY}/actions/runs/${RUN_ID}")
          test "$(jq -r .path       <<<"$run_json")" = ".github/workflows/deploy-staging.yml"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .head_sha   <<<"$run_json")" = "$manifest_sha"

      # Check 3 (warning only): has the frontend code moved on since this
      # candidate was built? Promoting an older reviewed candidate is
      # legitimate; this just makes staleness visible. The frontend repo is
      # private, so this reads it via the API with a read-only PAT; an
      # expired/failing token degrades to a warning, never a block.
      - name: Check frontend code freshness
        env:
          GH_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          manifest_sha=$(grep '^frontend_sha=' site/release-manifest.txt | cut -d= -f2)
          if [ -z "$manifest_sha" ]; then
            echo "::warning::Candidate has no frontend_sha in its manifest (built before the repo split?)."
          elif ! current_sha=$(gh api "repos/${FRONTEND_REPOSITORY}/commits/main" --jq .sha); then
            echo "::warning::Could not read ${FRONTEND_REPOSITORY} to check freshness (expired FRONTEND_REPO_TOKEN?)."
          elif [ "$current_sha" != "$manifest_sha" ]; then
            echo "::warning::Frontend code has changed since this candidate was built (${manifest_sha} -> ${current_sha}). Consider a fresh staging run."
          fi

      # Deploy the exact verified files. No build tooling, no Strapi token.
      - name: Deploy approved candidate to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages project create phihong-prod --production-branch=main \
            || echo "project already exists"
          npx wrangler@4 pages deploy site --project-name=phihong-prod --branch=main --commit-dirty=true

      # Dormant until a CLOUDFLARE_ZONE_ID secret exists (custom domain).
      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ]; then
            echo "::notice::No CLOUDFLARE_ZONE_ID configured yet - skipping cache purge."
          else
            curl --fail -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}'
          fi
